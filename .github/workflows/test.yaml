name: Install and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor and the python3.14 target of issue #11
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        run: python -m pip install uv

      - name: resolve and sync the environment
        # no uv.lock is committed (*.lock is gitignored here), so CI does a
        # fresh resolve — that is the point: it catches any dependency
        # dropping 3.14 support (the failure class of issue #11).
        # --python = this runner's own interpreter: uv's managed python
        # builds include the free-threaded 3.14t, where psutil 5.9.8
        # fails to compile, so never let uv pick one implicitly
        run: uv sync --python "$(python -c 'import sys; print(sys.executable)')"

      - name: package installs, stimela runs
        run: |
          uv run python -c "import tartcargo"
          uv run stimela --help

      - name: invoke test — YAML parse + stimela dry-run prevalidation
        run: |
          uv pip install invoke plumbum
          uv run invoke test
