_include:
    - genesis/tart-cargo-base.yml

cabs:
    tart-gnss-acquire:
        image:
            _use: vars.tart-cargo.images
            name: tools
        command: tart-gnss-acquire
        info: Calculate signal strengths, phases and doppler offsets for GPS, Galilea, Beidou and SBAS constellations
        inputs:
            file:
                dtype: File
                required: true
                info: A raw data file in .hdf format, downloaded from a TART
            gps:
                dtype: bool
                info: Acquire the GPS L1 C/A signal
            galileo:
                dtype: bool
                info: Acquire the Galileo L1 signal
            beidou:
                dtype: bool
                info: Acquire the Beidou L1 signal
            sbas:
                dtype: bool
                info: Acquire the SBAS L1 signal
            qzss:
                dtype: bool
                info: Acquire the QZSS L1 signal
            l1c:
                dtype: bool
                info: Acquire the GPS L1C signal
            all:
                dtype: bool
                info: Acquire the all the signals in the L1 band
            cn0:
                dtype: bool
                info:  With C/N0 estimation (slow, using the ABS method)
            prn:
                dtype: List[int]
                policies:
                    repeat: ','
                info: Only use the specified list of PRN numbers in the search.
            ant:
                dtype: List[int]
                policies:
                    repeat: ','
                info: Only use the specified antennas in the search.
            filter-freq-mad:
                dtype: float
                info: Ignore satellites with a Doppler Median Absolute Deviation greater than this value.
            filter-phase-mad:
                dtype: float
                info: Ignore satellites with a Phase Median Absolute Deviation greater than this value.
            output:
                dtype: File
                must_exist: false
                info: Set the name of the JSON output file
            i:
                dtype: int
                info: First antenna index (correlation mode)
            j:
                dtype: int
                info: Second antenna index (correlation mode)
            debug:
                dtype: bool
                info: Print per-PRN, per-antenna diagnostics to stderr
            benchmark:
                dtype: bool
                info: Single-PRN timing with startup/search breakdown
            test-antennas:
                dtype: bool
                info: Rank antennas by relative C/N0 quality (implies --cn0 and, unless a constellation flag is given, --all)
            test-min-cn0:
                dtype: float
                info: Reference-satellite C/N0 threshold in dB-Hz (default 44.0)
            rfi:
                dtype: bool
                info: Narrowband RFI report per antenna (spectral lines + autocorrelation fingerprint); cannot be combined with --benchmark, --test-antennas, --i/--j, or --simulate
            simulate:
                dtype: bool
                info: Generate a synthetic HDF5 observation instead of reading a recorded one
            sources:
                dtype: File
                info: Source catalogue JSON array, each source with name, az (deg), el (deg), r (m), and jy (Jy) (required with --simulate)
            positions:
                dtype: File
                info: Antenna positions JSON, array of [east, north, up] coordinates in metres (simulation mode)
            N:
                dtype: int
                info: Number of random antenna positions when --positions is not given (simulation mode)
            diameter:
                dtype: float
                info: Diameter of the random antenna circle in metres (simulation mode, default 3.0)
            seed:
                dtype: int
                info: RNG seed for the simulation
            sample-rate:
                dtype: float
                info: Sampling rate in Hz (simulation mode, default 16.368e6)
            center-freq:
                dtype: float
                info: Center frequency in Hz (simulation mode, default 4.092e6)
            band:
                dtype: float
                info: Frequency band in Hz (simulation mode, default 2.0e6)
            snr:
                dtype: float
                info: Signal-to-noise ratio in dB (required with --simulate)

