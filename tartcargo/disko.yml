# disko CLI (mirrors disko master after tmolteno/disko#12 and #25).
#
# tools v1.2.3 still ships disko 1.4.4 from PyPI (uploaded 2026-07-14), so
# until the image is rebuilt recipes must keep passing `healpix: true`, and
# `no-regularization` only works once the image contains a newer disko.
_include:
    - genesis/tart-cargo-base.yml

cabs:
    disko:
        name: disko
        image:
            _use: vars.tart-cargo.images
            name: tools
        command: disko
        info: Image the radio sky using discrete operator techniques.

        inputs:
            ms:
                dtype: MS
                required: true
                info: The measurement set
            file:
                dtype: File
                must_exist: true
                required: false
                info: TART .h5 visibility file
            column:
                dtype: str
                info: The measurement set column to image
            HDF:
                dtype: str
                required: true
                info: Generate an HDF format field of view
            nvis:
                dtype: int
                info: Number of visibilities to use
            channel:
                dtype: int
                info: The frequency channel to use
            field:
                dtype: int
                info: The field to use
            ddid:
                dtype: int
                info: The DDID from the measurement set
            dir:
                dtype: Directory
                must_exist: false
                info: Output directory
            healpix:
                dtype: bool
                info: Use HealPix tiling (the default when --mesh is not given; --mesh is unavailable in the tools image)
            nside:
                dtype: int
                required: false
                info: Healpix nside parameter for display purposes only
            fov:
                dtype: str
                info: Field of view; an angle with a suffix is required (e.g. 170deg, 30arcmin, 12arcsec — bare numbers are rejected)
            res:
                dtype: str
                info: Maximum resolution of the sky; an angle with a suffix is required (e.g. 0.5deg, 30arcmin, 12arcsec — bare numbers are rejected)
            lsqr:
                dtype: bool
                info: Use lsqr in matrix-free
            lsmr:
                dtype: bool
                info: Use lsmr in matrix-free
            fista:
                dtype: bool
                info: Use FISTA in matrix-free
            lasso:
                dtype: bool
                info: Use L1 regularization
            tikhonov:
                dtype: bool
                info: Use L2 regularization (the default when no algorithm flag is given)
            no-regularization:
                dtype: bool
                info: Solve the visibilities directly with no regularization (opt-in — unregularized imaging is no longer the silent default)
            matrix-free:
                dtype: bool
                info: Use matrix-free regularization
            niter:
                dtype: int
                info: Number of iterations for iterative solutions
            alpha:
                dtype: float
                info: Regularization parameter (defaults to 0.02)
            l1-ratio:
                dtype: float
                info: "Regularization parameter, ratio of l1 to l2 (1.0 means l1 only)"
            # --show-sources and --elevation are no longer disko inputs:
            # disko rejects both and points at disko_draw (tmolteno/disko#25),
            # so source overplotting belongs on the disko-draw cab.
            title:
                dtype: str
                info: Prefix the output files
            display:
                dtype: bool
                info: Display image to the user
            PNG:
                dtype: bool
                info: Generate a PNG format image
            PDF:
                dtype: bool
                info: Generate a PDF format image
            SVG:
                dtype: bool
                info: Generate a SVG format image
            VTK:
                dtype: bool
                info: Generate a VTK mesh format image
            FITS:
                dtype: bool
                info: Generate a FITS format image
            cv:
                dtype: bool
                info: Use cross validation
            dask:
                dtype: bool
                info: Use dask
            debug:
                dtype: bool
                info: Display debugging information
